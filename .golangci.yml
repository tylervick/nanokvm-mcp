version: "2"

run:
  # Lint the `device` build tag too. The opt-in hardware smoke test in
  # internal/devicetest never runs in CI, so linting is the only thing that
  # type-checks it — without this it would rot silently until someone next
  # reached for real hardware.
  build-tags:
    - device

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        # G124 flags http.Cookie without Secure/HttpOnly, but every cookie
        # here is attached to *outgoing client* requests, where those
        # attributes are server-set response fields and have no meaning.
        - G124
  exclusions:
    rules:
      # Tests run against local httptest fakes: fixed creds, unchecked
      # writes/closes, and fake tokens are deliberate there.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tylervick/nanokvm-mcp
