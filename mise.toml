[tools]
go = "1.26.5"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[settings]
# Prepend mise-managed tool dirs ahead of everything else on PATH. Without
# this, a Homebrew go on PATH shadows the pinned toolchain and its compiler
# mismatches the exported GOROOT ("go tool version" errors) under `mise run`.
activate_aggressive = true

[env]
CGO_ENABLED = "0"

[tasks.build]
run = 'GOOS=linux GOARCH=riscv64 go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o dist/nanokvm-mcp ./cmd/nanokvm-mcp'

[tasks.build-host]
run = 'go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o dist/nanokvm-mcp-host ./cmd/nanokvm-mcp'

[tasks.test]
run = "go test -race -shuffle=on ./..."
# The race detector needs cgo on linux (macOS links it internally without).
# Only the test task gets cgo; device builds stay CGO_ENABLED=0 static.
env = { CGO_ENABLED = "1" }

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.apicheck]
run = "go test ./tools/apicheck/..."

[tasks.sizecheck]
depends = ["build"]
run = "sz=$(wc -c < dist/nanokvm-mcp); echo \"binary: $sz bytes\"; test \"$sz\" -lt 15728640 || { echo 'FAIL: binary exceeds 15MB'; exit 1; }"
