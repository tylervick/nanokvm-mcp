name: ci
on:
  push:
  pull_request:
  # schedule:
    # Weekly vulnerability sweep: new CVEs land against unchanged code.
    # - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or fetches; don't leave the token in .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run lint
      - run: mise run test
      - run: mise run vulncheck
      - run: mise run sizecheck
      - run: mise run apicheck
