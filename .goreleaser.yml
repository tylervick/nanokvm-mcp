version: 2

project_name: nanokvm-mcp

builds:
  - main: ./cmd/nanokvm-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - riscv64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # The only artifact is a single static riscv64 binary; ship it as-is
  # (no tar.gz) so users can scp it straight to the device.
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
